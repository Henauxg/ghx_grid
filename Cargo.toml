[package]
name = "ghx_grid"
version = "0.7.0"
description = "2D & 3D grid structures & utilities"
repository = "https://github.com/Henauxg/ghx_grid"
documentation = "https://docs.rs/ghx_grid"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "grid"]
categories = ["game-development"]
readme = "README.md"

[features]
default = ["serde"]
serde = ["dep:serde"]

# Disabled by default, enabling it simply derives `Component` on common structs of the crate.
bevy = ["dep:bevy"]
# Disabled by default, enabling it simply derives `Reflect` on common structs of the crate.
reflect = ["bevy"]

[dependencies]

# Only enabled when the "serde" feature is enabled
serde = { version = "1.0.197", optional = true, features = ["derive"] }

# Only enabled when the "bevy" feature is enabled
bevy = { version = ">=0.16,<=0.17", optional = true, default-features = false }
